<!doctype html>
<!--
  The /videos film: 90 seconds, vertical, one page that draws any moment of
  itself. renderAt(t) sets every element from the time alone (it awaits only
  the satellite tiles that moment needs), so frames render in any order, on
  any number of tabs, and always come out the same. render.mjs seeks it frame
  by frame, like the homepage trailer (scripts/trailer/).

  Six acts, each in its own type and palette:
    0–15   Orbit       Orbitron + Plex Mono over NASA's globe, then Esri
                       satellite tiles all the way down to Pune; a browser opens
    15–28  Back-story  a VHS rewind, then a scrapbook of the channel by year
                       (DM Serif Display, Caveat)
    28–34  The gap     the site's counts on index cards, and the chores of
                       listing a video by hand (Special Elite, Bebas Neue)
    34–40  Unveiling   crimson and gold; the ribbons come off (Abril Fatface)
    40–63  Features    the live /videos page on a phone (Space Grotesk)
    63–80  Under the hood   blueprint: the admin's Sync now, then the data
                       flowing from YouTube to the site (JetBrains Mono)
    80–90  Finale      back out to orbit, and the address (Anton)

  The music is 120 BPM (score.mjs): a beat is 0.5 s, a bar 2 s. Every number
  comes from window.FILM (data.js, written by render.mjs from the live videos
  table and /api/stats); nothing here is typed in.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bebas+Neue&family=Caveat:wght@600;700&family=Chakra+Petch:wght@600;700&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@500;800&family=Playfair+Display:ital,wght@1,600&family=Space+Grotesk:wght@500;700&family=Special+Elite&family=Tiro+Devanagari+Marathi&family=VT323&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
  .scene { position: absolute; inset: 0; display: none; transform-origin: 540px 960px; overflow: hidden; }
  .c { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .ch { display: inline-block; white-space: pre; }
  .full { position: absolute; inset: 0; }

  .orb { font-family: Orbitron, sans-serif; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .plex { font-family: "IBM Plex Mono", monospace; }
  .caveat { font-family: Caveat, cursive; font-weight: 700; }
  .dms { font-family: "DM Serif Display", serif; }
  .typer { font-family: "Special Elite", monospace; }
  .bebas { font-family: "Bebas Neue", sans-serif; letter-spacing: .02em; line-height: .9; }
  .abril { font-family: "Abril Fatface", serif; line-height: .95; }
  .playi { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; }
  .sg { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .jb { font-family: "JetBrains Mono", monospace; }
  .chakra { font-family: "Chakra Petch", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .anton { font-family: Anton, sans-serif; text-transform: uppercase; line-height: .92; }
  .vt { font-family: VT323, monospace; }
  .deva { font-family: "Tiro Devanagari Marathi", serif; }

  /* phone */
  .phone { width: 600px; height: 1240px; border-radius: 86px; background: linear-gradient(145deg, #2b2d33, #0b0c10 40%, #1b1c21); padding: 20px;
    box-shadow: 0 0 0 2px #45474f, 0 70px 140px rgba(0,0,0,.45); }
  .scr { width: 560px; height: 1200px; border-radius: 66px; overflow: hidden; position: relative; background: #fff; }
  .scr img.shot { position: absolute; left: 0; top: 64px; width: 560px; transform-origin: 50% 0; }
  .sbar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 8px 52px 0; font: 700 22px Inter; z-index: 2; background: #fff; color: #111; }
  .island { position: absolute; top: 34px; left: 50%; width: 156px; height: 42px; margin-left: -78px; background: #000; border-radius: 21px; z-index: 3; }
  .glare { position: absolute; inset: 20px; border-radius: 66px; background: linear-gradient(118deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 30%); z-index: 6; pointer-events: none; }
  .finger { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,.55); border: 3px solid rgba(0,0,0,.35); box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 5; }
  .ripple { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 5px solid #e11d2a; z-index: 5; }

  /* browser window */
  .win { border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,255,255,.18); }
  .win .tabs { height: 64px; background: #dfe3ea; display: flex; align-items: flex-end; padding: 0 22px; gap: 10px; }
  .win .dots { display: flex; gap: 12px; align-self: center; margin-right: 18px; }
  .win .dots i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .win .tab { height: 48px; padding: 0 22px; border-radius: 14px 14px 0 0; background: #fff; color: #222; font: 600 21px Inter; display: flex; align-items: center; gap: 12px; }
  .win .addr { height: 76px; background: #fff; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-bottom: 1.5px solid #e5e7eb; }
  .win .url { flex: 1; height: 50px; border-radius: 25px; background: #f1f3f6; display: flex; align-items: center; gap: 12px; padding: 0 24px; font: 500 25px Inter; color: #111; }
  .win .load { position: absolute; left: 0; height: 4px; background: #2563eb; }
  .win .body { position: relative; overflow: hidden; background: #fff; }
  .win .body img { position: absolute; left: 0; top: 0; }

  /* scrapbook */
  .paper { background: #f1e7d2; }
  .polaroid { background: #fdfbf6; padding: 16px 16px 64px; box-shadow: 0 18px 40px rgba(60,40,10,.35); border-radius: 4px; }
  .polaroid .ph { width: 100%; height: 100%; background-size: cover; background-position: center; }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: 700 34px Caveat; color: #2a2118; }
  .tape { position: absolute; width: 140px; height: 42px; background: rgba(255,240,170,.75); top: -18px; left: 50%; margin-left: -70px; transform: rotate(-4deg); box-shadow: 0 2px 4px rgba(0,0,0,.08); }
  .gold .ch { background: linear-gradient(180deg, #fff6d8, #f5c451 55%, #b8860b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stamp { border: 8px solid #c81e1e; color: #c81e1e; padding: 10px 26px; border-radius: 14px; font-family: "Bebas Neue"; letter-spacing: .04em; mix-blend-mode: multiply; }

  /* cards */
  .card { background: #f6f1e6; color: #1d1b16; border-radius: 22px; box-shadow: 0 24px 50px rgba(0,0,0,.4); }
  .glass { background: rgba(255,255,255,.82); border: 1.5px solid rgba(0,0,0,.06); box-shadow: 0 24px 60px rgba(40,10,10,.18); backdrop-filter: blur(10px); border-radius: 26px; color: #111; }
  .neon { border: 2px solid rgba(103,232,249,.65); background: rgba(8,24,52,.85); box-shadow: 0 0 40px rgba(103,232,249,.18), inset 0 0 30px rgba(103,232,249,.08); border-radius: 22px; color: #e6f7ff; }

  #grain { position: absolute; inset: -200px; opacity: .06; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #hud { position: absolute; left: 54px; right: 54px; top: 70px; display: flex; justify-content: space-between; font: 600 22px "IBM Plex Mono"; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; }
  #hudbar { position: absolute; left: 54px; top: 112px; height: 3px; width: 0; }
  #lines div { position: absolute; left: 0; right: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="earth" class="layer" width="1080" height="1920"></canvas>
  <div id="cam"></div>
  <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
  <div id="lines" class="layer"></div>
  <canvas id="grainC" width="512" height="512" style="display:none"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="hud"><span id="hudChap"></span><span id="hudSite"></span></div>
  <div id="hudbar"></div>
  <div id="flash"></div>
</div>
<script>
window.addEventListener("error", (e) => { window.__error = window.__error || String(e.message); });
</script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const s = document.createElement("script");
  s.src = params.get("data") || "data.js";
  s.onload = () => boot().catch((e) => { window.__error = String(e && e.stack || e); });
  s.onerror = () => { window.__error = "data.js failed to load"; };
  document.head.appendChild(s);
})();

// ---------------------------------------------------------------- maths
const W = 1080, H = 1920, BEAT = 0.5;
const cl = (x) => Math.max(0, Math.min(1, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const Ez = {
  out: (x) => 1 - (1 - x) ** 3,
  in: (x) => x * x * x,
  io: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  sine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  expo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  expoIn: (x) => (x <= 0 ? 0 : 2 ** (10 * x - 10)),
  back: (x) => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1),
};
const win = (t, a, b, fi = .3, fo = .3) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
}
const hash = (n) => rng(n * 9973 + 17)();
const fmt = (n) => Math.round(n).toLocaleString("en-IN");
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})`; };
const isDeva = (s) => /[ऀ-ॿ]/.test(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1).trim()}…` : s);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
// Monotone cubic through [t, v] keys (Fritsch–Carlson): smooth, never overshoots.
function spline(keys) {
  const n = keys.length, d = [], m = [];
  for (let i = 0; i < n - 1; i += 1) d.push((keys[i + 1][1] - keys[i][1]) / (keys[i + 1][0] - keys[i][0]));
  m.push(d[0]);
  for (let i = 1; i < n - 1; i += 1) m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
  m.push(d[n - 2]);
  for (let i = 0; i < n - 1; i += 1) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
  }
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[n - 1][0]) return keys[n - 1][1];
    let i = 0;
    while (t > keys[i + 1][0]) i += 1;
    const h = keys[i + 1][0] - keys[i][0], u = (t - keys[i][0]) / h;
    const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
    return h00 * keys[i][1] + h10 * h * m[i] + h01 * keys[i + 1][1] + h11 * h * m[i + 1];
  };
}

// ---------------------------------------------------------------- dom kit
const cam = document.getElementById("cam");
function el(parent, cls, html = "", css = "") {
  const d = document.createElement("div");
  d.className = cls;
  if (html) d.innerHTML = html;
  if (css) d.style.cssText += css;
  parent.appendChild(d);
  return d;
}
// Places an element by its centre. Every transform is rebuilt from scratch.
function S(e, o = {}) {
  const st = e.style;
  const x = o.x ?? e._x ?? 540, y = o.y ?? e._y ?? 960;
  let tf = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`;
  if (o.p) tf += ` perspective(${o.p}px)`;
  if (o.rx) tf += ` rotateX(${o.rx.toFixed(2)}deg)`;
  if (o.ry) tf += ` rotateY(${o.ry.toFixed(2)}deg)`;
  if (o.r) tf += ` rotate(${o.r.toFixed(2)}deg)`;
  if (o.sk) tf += ` skewX(${o.sk.toFixed(2)}deg)`;
  tf += ` scale(${(o.s ?? 1).toFixed(4)}${o.sy != null ? `,${o.sy.toFixed(4)}` : ""})`;
  st.transform = tf;
  const op = o.o ?? 1;
  st.opacity = op.toFixed(3);
  st.visibility = op <= 0.001 ? "hidden" : "visible";
  st.filter = o.blur > 0.2 ? `blur(${o.blur.toFixed(1)}px)` : (o.f || "");
  if (o.clip !== undefined) st.clipPath = o.clip;
}
const at = (e, x, y) => { e._x = x; e._y = y; S(e, { o: 0 }); return e; };
// Text split into letters (words for Devanagari, whose letters join).
function split(e) {
  const txt = e.textContent;
  const parts = isDeva(txt) ? txt.split(/(\s+)/) : [...txt];
  e.innerHTML = parts.map((c) => `<span class="ch">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
  e._ch = [...e.children];
  return e;
}
// Kinetic type: each letter enters in turn, and all leave together at `out`.
function kin(e, t, t0, { mode = "rise", stg = .035, dur = .55, out = Infinity, od = .25 } = {}) {
  const ex = Ez.in(P(t, out - od, out));
  e._ch.forEach((c, i) => {
    const k = P(t, t0 + i * stg, t0 + i * stg + dur);
    const q = mode === "drop" || mode === "pop" || mode === "bounce" ? Ez.back(k) : Ez.expo(k);
    let tf = "", f = 0;
    if (mode === "rise") { tf = `translateY(${(1 - q) * 0.9}em) rotate(${(1 - q) * 9}deg)`; f = (1 - k) * 12; }
    if (mode === "slam") { tf = `scale(${lerp(2.4, 1, q)})`; f = (1 - k) * 18; }
    if (mode === "slideL") { tf = `translateX(${(1 - q) * -2}em) skewX(${(1 - q) * -25}deg)`; f = (1 - k) * 14; }
    if (mode === "slideR") { tf = `translateX(${(1 - q) * 2}em) skewX(${(1 - q) * 25}deg)`; f = (1 - k) * 14; }
    if (mode === "flip") { tf = `perspective(600px) rotateX(${(1 - q) * -100}deg)`; }
    if (mode === "drop") { tf = `translateY(${(1 - q) * -1.6}em)`; }
    if (mode === "pop") { tf = `scale(${q})`; }
    if (mode === "bounce") { tf = `translateY(${(1 - q) * 1.2}em) scale(${lerp(.4, 1, q)})`; }
    if (mode === "type") { tf = ""; c.style.opacity = k > 0 ? 1 : 0; }
    if (ex > 0) { tf += ` translateY(${-ex * 0.5}em)`; f += ex * 14; }
    c.style.transform = tf;
    if (mode !== "type") c.style.opacity = (Math.min(k * 1.6, 1) * (1 - ex)).toFixed(3);
    else c.style.opacity = (k > 0 ? 1 - ex : 0).toFixed(3);
    c.style.filter = f > .3 ? `blur(${f.toFixed(1)}px)` : "";
  });
  const off = t < t0 - .05 || ex >= 1;
  e.style.opacity = off ? 0 : 1;
  e.style.visibility = off ? "hidden" : "visible";
}
const count = (e, t, t0, d, n, suffix = "") => { e.textContent = fmt(n * Ez.out(P(t, t0, t0 + d))) + suffix; };
// Typed text: the first k characters of `s`, with a caret while typing.
const typed = (e, s, t, t0, cps, caret = true) => {
  const n = Math.max(0, Math.min(s.length, Math.floor((t - t0) * cps)));
  const blink = caret && (n < s.length || Math.floor(t * 2.5) % 2 === 0) && t >= t0 - .3;
  e.innerHTML = esc(s.slice(0, n)) + (blink ? '<span style="opacity:.8">|</span>' : "");
};

// Phone: a mockup holding shots (FILM.shots); show one at a time, scroll it.
const K = 560 / 828; // shot px → screen px; CSS px are 2 shot px.
function phone(parent, names, { dark = false } = {}) {
  const ph = el(parent, "phone c");
  const scr = el(ph, "scr");
  ph._scr = scr;
  ph._img = {};
  names.forEach((nm) => {
    const im = document.createElement("img");
    im.className = "shot";
    im.src = F.shots[nm].url;
    scr.appendChild(im);
    ph._img[nm] = im;
  });
  ph._bar = el(scr, "sbar", '<span>9:41</span><span style="letter-spacing:4px">▮▮▮ ◔</span>');
  if (dark) { ph._bar.style.background = "#0c0a09"; ph._bar.style.color = "#eee"; }
  el(ph, "island");
  el(ph, "glare");
  ph._finger = el(scr, "finger");
  ph._ripple = el(scr, "ripple");
  ph._extra = el(scr, "full", "", "z-index:4;pointer-events:none");
  return ph;
}
// shots: { name: opacity }; scroll in screen px (clamped to the shot's length).
function show(ph, shots, scroll = 0, zoom = 1) {
  Object.entries(ph._img).forEach(([nm, im]) => {
    const o = shots[nm] || 0;
    im.style.opacity = o;
    im.style.visibility = o > 0 ? "visible" : "hidden";
    if (o > 0) {
      const max = Math.max(0, im.naturalHeight * (560 / im.naturalWidth) - 1136);
      im.style.transform = `translateY(${-Math.min(scroll, max)}px) scale(${zoom})`;
    }
  });
}
// Where a page point (CSS px) of a shot lands on the phone screen.
const onShot = (nm, p, scroll) => ({ x: p.x * 2 * K, y: (p.y - (F.shots[nm].from || 0)) * 2 * K + 64 - scroll });
// A finger that arrives, presses at t0, and lifts.
function tap(ph, pos, t, t0) {
  const k = win(t, t0 - .45, t0 + .45, .25, .25);
  const press = 1 - .25 * Math.exp(-(((t - t0) * 9) ** 2));
  S(ph._finger, { x: pos.x + 42 + (1 - k) * 80, y: pos.y + 42 + (1 - k) * 140, o: k, s: press });
  const q = P(t, t0, t0 + .5);
  S(ph._ripple, { x: pos.x + 42, y: pos.y + 42, o: q > 0 && q < 1 ? 1 - q : 0, s: lerp(.4, 2.4, Ez.out(q)) });
}
const noTap = (ph) => { S(ph._finger, { o: 0 }); S(ph._ripple, { o: 0 }); };

// A browser window: tab, address bar, and a body holding one image.
function browser(parent, { w, h, title, img, imgW, dark = false }) {
  const b = el(parent, "win c", "", `width:${w}px;height:${h}px`);
  const tabs = el(b, "tabs");
  el(tabs, "dots", '<i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>');
  b._tab = el(tabs, "tab", `<span style="width:22px;height:22px;border-radius:6px;background:#13101e;display:inline-block"></span>${esc(title)}`);
  const addr = el(b, "addr", '<span style="font:600 30px Inter;color:#9aa0a6">‹ ›</span>');
  b._url = el(addr, "url");
  b._load = el(b, "load", "", "top:140px;width:0");
  b._body = el(b, "body", "", `height:${h - 140}px`);
  b._start = el(b._body, "full", `<div style="position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;width:80%">
    <div class="sg" style="font-size:64px;color:#202124;margin-bottom:40px">Where to?</div>
    <div style="height:84px;border-radius:42px;border:2px solid #dadce0;display:flex;align-items:center;gap:20px;padding:0 30px;box-shadow:0 4px 14px rgba(0,0,0,.08)"><div style="width:36px;height:36px">${ICON.search("#9aa0a6")}</div><span style="font:400 30px Inter;color:#9aa0a6">Search or type a URL</span></div>
    <div style="display:flex;justify-content:center;gap:34px;margin-top:56px">${["#ea4335", "#fbbc05", "#34a853", "#4285f4"].map((c) => `<i style="width:96px;height:96px;border-radius:24px;background:${c};opacity:.85;display:block"></i>`).join("")}</div></div>`, "background:#fff");
  b._img = document.createElement("img");
  b._img.src = img;
  b._img.style.width = `${imgW || w}px`;
  b._body.appendChild(b._img);
  if (dark) b.style.background = "#111";
  return b;
}

// Line icons, drawn on with stroke-dashoffset where it matters.
const ICON = {
  play: (c = "#fff") => `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="${c}"/></svg>`,

// ---------------------------------------------------------------- scenes
const SCENES = [];
function scene(a, b, { enter = "cut", exit = "cut", bg = null, chapter = null, ink = "#fff" }, build) {
  const root = el(cam, "scene");
  if (bg) root.style.background = bg;
  const sc = { a, b, enter, exit, chapter, ink, root };
  sc.update = build(root, sc);
  SCENES.push(sc);
  return sc;
}
function transition(sc, t) {
  const o = { x: 540, y: 960, s: 1, o: 1, blur: 0, clip: "none", r: 0 };
  const ei = P(t, sc.a - .15, sc.a + .3), eo = P(t, sc.b - .3, sc.b + .15);
  switch (sc.enter) {
    case "whip": o.x += (1 - Ez.expo(ei)) * 1300; o.blur += (1 - ei) * 40; o.sk = (1 - ei) * -12; break;
    case "whipUp": o.y += (1 - Ez.expo(ei)) * 2100; o.blur += (1 - ei) * 40; break;
    case "zoom": o.s *= lerp(.35, 1, Ez.expo(ei)); o.o *= ei; o.blur += (1 - ei) * 30; o.r += (1 - Ez.expo(ei)) * -8; break;
    case "circle": { const k = Ez.io(P(t, sc.a, sc.a + .6)); o.clip = `circle(${(k * 1250).toFixed(0)}px at 540px 960px)`; break; }
    case "wipeUp": { const k = Ez.io(P(t, sc.a - .1, sc.a + .45)); o.clip = `inset(${((1 - k) * 100).toFixed(1)}% 0 0 0)`; break; }
    case "wipeDiag": { const k = Ez.io(P(t, sc.a - .1, sc.a + .5)); const p = lerp(-60, 160, k); o.clip = `polygon(0 0, ${p}% 0, ${p - 60}% 100%, 0 100%)`; break; }
    case "fade": o.o *= P(t, sc.a - .2, sc.a + .5); break;
    default: break;
  }
  switch (sc.exit) {
    case "whip": o.x -= Ez.expoIn(eo) * 1300; o.blur += eo * 40; o.sk = (o.sk || 0) + eo * 12; break;
    case "whipUp": o.y -= Ez.expoIn(eo) * 2100; o.blur += eo * 40; break;
    case "zoomThrough": o.s *= lerp(1, 6, Ez.expoIn(eo)); o.o *= 1 - eo; o.blur += eo * 20; break;
    case "zoomOut": o.s *= lerp(1, .4, Ez.in(eo)); o.o *= 1 - eo; o.blur += eo * 25; break;
    case "fade": o.o *= 1 - eo; break;
    default: break;
  }
  S(sc.root, o);
}

// ---------------------------------------------------------------- the earth
// The globe (orthographic, drawn per pixel from Blue Marble) hands over to
// Web Mercator satellite tiles at the zoom where the two agree in scale.
const GEO = {};
function worldPx(lat, lon, z) {
  const size = 256 * 2 ** z, s = Math.sin((lat * Math.PI) / 180);
  return { x: ((lon + 180) / 360) * size, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * size };
}
// Globe radius (px) matching Mercator zoom z near the target's latitude.
const radiusAt = (z) => (256 * 2 ** z) / (2 * Math.PI * Math.cos((F.geo.lat * Math.PI) / 180));
const zoomAt = (R) => Math.log2((R * 2 * Math.PI * Math.cos((F.geo.lat * Math.PI) / 180)) / 256);

// The camera, seconds → zoom. Below HANDOVER it is the globe.
const HANDOVER = [4.45, 4.8];
let ZOOM_IN, ZOOM_OUT;
const TILES = new Map();
function tile(z, x, y) {
  const key = `${z}/${x}-${y}`;
  if (!TILES.has(key)) {
    const im = new Image();
    im.src = `${F.geo.tiles}/${z}/${x}-${y}.jpg`;
    TILES.set(key, im.decode().then(() => im, () => null));
  }
  return TILES.get(key);
}
async function tilesAt(L) {
  const c = worldPx(F.geo.lat, F.geo.lon, L), n = 2 ** L, out = [];
  for (let ty = Math.floor((c.y - H) / 256); ty <= Math.floor((c.y + H) / 256); ty += 1) {
    for (let tx = Math.floor((c.x - W) / 256); tx <= Math.floor((c.x + W) / 256); tx += 1) {
      if (ty >= 0 && ty < n) out.push(tile(L, ((tx % n) + n) % n, ty).then((im) => ({ im, tx, ty })));
    }
  }
  // Keep only nearby levels decoded.
  [...TILES.keys()].forEach((k) => { const lz = +k.split("/")[0]; if (Math.abs(lz - L) > 2) TILES.delete(k); });
  return Promise.all(out);
}
async function drawMap(g, z, alpha, clipR = 0) {
  const L = Math.max(F.geo.first, Math.min(F.geo.last, Math.ceil(z - 1e-6)));
  const s = 2 ** (z - L);
  const levels = L > F.geo.first ? [L - 1, L] : [L];
  const sets = await Promise.all(levels.map((lv) => tilesAt(lv)));
  g.save();
  g.globalAlpha = alpha;
  if (clipR) { g.beginPath(); g.arc(540, 960, clipR, 0, 7); g.clip(); }
  sets.forEach((set, i) => {
    const lv = levels[i], sc = 2 ** (z - lv), c = worldPx(F.geo.lat, F.geo.lon, lv);
    set.forEach(({ im, tx, ty }) => {
      if (!im) return;
      const x = 540 + (tx * 256 - c.x) * sc, y = 960 + (ty * 256 - c.y) * sc, d = 256 * sc;
      if (x > W || y > H || x + d < 0 || y + d < 0) return;
      g.drawImage(im, x, y, d + .8, d + .8);
    });
  });
  g.restore();
  return s;
}
// A place on the ground → screen, at zoom z.
const ground = (lat, lon, z) => {
  const p = worldPx(lat, lon, z), c = worldPx(F.geo.lat, F.geo.lon, z);
  return { x: 540 + p.x - c.x, y: 960 + p.y - c.y };
};

let TEX = null;
function drawGlobe(g, { R, cx, cy, lon0, lat0, light = [-.45, .55, .7] }) {
  const buf = GEO.buf, d = buf.data;
  d.fill(0);
  const { w: tw, h: th, data: tex } = TEX;
  const sp = Math.sin(lat0 * Math.PI / 180), cp = Math.cos(lat0 * Math.PI / 180), l0 = lon0 * Math.PI / 180;
  const ln = Math.hypot(...light), lx = light[0] / ln, ly = light[1] / ln, lz = light[2] / ln;
  const y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(H - 1, Math.ceil(cy + R));
  for (let y = y0; y <= y1; y += 1) {
    const ny = (cy - y) / R;
    if (ny > 1 || ny < -1) continue;
    const span = Math.sqrt(1 - ny * ny) * R;
    const x0 = Math.max(0, Math.floor(cx - span)), x1 = Math.min(W - 1, Math.ceil(cx + span));
    for (let x = x0; x <= x1; x += 1) {
      const nx = (x - cx) / R, r2 = nx * nx + ny * ny;
      if (r2 >= 1) continue;
      const nz = Math.sqrt(1 - r2);
      const wy = ny * cp + nz * sp, wz = -ny * sp + nz * cp;
      const lat = Math.asin(wy), lon = l0 + Math.atan2(nx, wz);
      let u = ((lon / (2 * Math.PI) + .5) % 1 + 1) % 1 * tw, v = (.5 - lat / Math.PI) * th;
      if (v < 0) v = 0; if (v > th - 1.001) v = th - 1.001;
      const ui = Math.floor(u), vi = Math.floor(v), fu = u - ui, fv = v - vi, u2 = (ui + 1) % tw;
      const i00 = (vi * tw + ui) * 4, i10 = (vi * tw + u2) * 4, i01 = ((vi + 1) * tw + ui) * 4, i11 = ((vi + 1) * tw + u2) * 4;
      const lam = Math.max(0, nx * lx + ny * ly + nz * lz);
      const shade = .22 + .95 * lam;
      const rim = (1 - nz) ** 3;
      const o = (y * W + x) * 4;
      for (let ch = 0; ch < 3; ch += 1) {
        const c = (tex[i00 + ch] * (1 - fu) + tex[i10 + ch] * fu) * (1 - fv) + (tex[i01 + ch] * (1 - fu) + tex[i11 + ch] * fu) * fv;
        const atm = [110, 170, 255][ch];
        d[o + ch] = Math.min(255, c * shade * (1 - rim * .55) + atm * rim * .75);
      }
      // Anti-aliased limb.
      d[o + 3] = Math.min(255, (1 - r2) * R * 255 * 1.2);
    }
  }
  GEO.ctx.putImageData(buf, 0, 0);
  // Atmosphere: a halo outside the limb, brighter on the lit side.
  const halo = g.createRadialGradient(cx, cy, R * .98, cx, cy, R * 1.16);
  halo.addColorStop(0, "rgba(120,180,255,.55)");
  halo.addColorStop(.35, "rgba(80,140,255,.18)");
  halo.addColorStop(1, "rgba(60,120,255,0)");
  g.fillStyle = halo;
  g.beginPath(); g.arc(cx, cy, R * 1.16, 0, 7); g.fill();
  g.drawImage(GEO.cv, 0, 0);
}

const STARS = [];
function drawStars(g, t, a, drift = 1) {
  if (a <= 0) return;
  STARS.forEach(([x, y, r, ph]) => {
    const tw = .55 + .45 * Math.sin(t * 2.2 + ph);
    g.fillStyle = `rgba(255,255,255,${(a * tw * (r > 1.6 ? 1 : .7)).toFixed(3)})`;
    g.beginPath(); g.arc((x + t * 4 * drift) % W, y, r, 0, 7); g.fill();
  });
}

// Orbit: where the globe looks and how big it is, before the hand-over.
const ORBIT = {
  R: (t) => lerp(250, radiusAt(HANDOVER[0]), Ez.in(P(t, .3, 5.8))),
  lon: (t) => lerp(F.geo.lon - 95, F.geo.lon, Ez.io(P(t, 0, 5.4))),
  lat: (t) => lerp(F.geo.lat - 14, F.geo.lat, Ez.io(P(t, 0, 5.4))),
};

async function drawEarth(t) {
  const c = document.getElementById("earth"), g = c.getContext("2d");
  const on = t < 15.4 || t >= 79.7;
  c.style.display = on ? "block" : "none";
  if (!on) return null;
  g.fillStyle = "#020309";
  g.fillRect(0, 0, W, H);
  let z;
  if (t < 15.4) z = ZOOM_IN(t);
  else z = ZOOM_OUT(t);
  const R = t < 6 ? ORBIT.R(t) : radiusAt(z);
  const globeA = 1 - P(z, HANDOVER[0], HANDOVER[1]);
  drawStars(g, t, cl(1 - (R - 700) / 600) * (t >= 80 ? P(t, 81.6, 83) : 1));
  if (globeA > 0) {
    const lon = t < 6 ? ORBIT.lon(t) : F.geo.lon, lat = t < 6 ? ORBIT.lat(t) : F.geo.lat;
    // The planet keeps turning a little in the finale.
    const spin = t >= 80 ? (t - 80) * -9 : 0;
    drawGlobe(g, { R, cx: 540, cy: 960, lon0: lon + spin * P(R, 900, 400), lat0: lat });
  }
  if (globeA < 1) await drawMap(g, Math.max(z, HANDOVER[0]), 1 - globeA, globeA > 0 ? R : 0);
  return { z, R };
}

// ---------------------------------------------------------------- boot
function boot() {
  window.F = window.FILM;
  // Zoom keys (s, zoom): slow off the globe, quick through the middle,
  // and a slow last descent onto Pune.
  ZOOM_IN = spline([[5.8, HANDOVER[0]], [7.0, 5.7], [8.4, 7.4], [9.8, 10.4], [11.0, 14.0], [12.6, 15.6], [15.4, 16]]);
  ZOOM_OUT = spline([[80, 15.6], [81.2, 13.5], [82.4, 9], [83.5, 5.2], [84.6, 3.6], [90, 3.2]]);
  const r = rng(3);
  for (let i = 0; i < 420; i += 1) STARS.push([r() * W, r() * H, r() < .08 ? 2.2 : .6 + r() * 1.1, r() * 7]);
  GEO.cv = document.createElement("canvas");
  GEO.cv.width = W; GEO.cv.height = H;
  GEO.ctx = GEO.cv.getContext("2d");
  GEO.buf = GEO.ctx.createImageData(W, H);
  const globe = new Image();
  globe.src = F.geo.globe;
  buildAll();
  const imgs = [...document.images].map((im) => (im.complete ? im.decode().catch(() => {}) : new Promise((res) => { im.onload = () => im.decode().then(res, res); im.onerror = res; })));
  const faces = ["800 40px Orbitron", "400 40px 'IBM Plex Mono'", "800 40px Inter", "700 40px Caveat", "40px 'DM Serif Display'", "40px 'Special Elite'",
    "40px 'Bebas Neue'", "40px 'Abril Fatface'", "italic 600 40px 'Playfair Display'", "700 40px 'Space Grotesk'", "700 40px 'JetBrains Mono'",
    "700 40px 'Chakra Petch'", "40px Anton", "40px VT323", "40px 'Tiro Devanagari Marathi'"];
  return Promise.all([...imgs, globe.decode(), ...faces.map((f) => document.fonts.load(f, "Aaपुणे"))])
    .then(() => document.fonts.ready)
    .then(() => {
      const cv = document.createElement("canvas");
      cv.width = globe.naturalWidth; cv.height = globe.naturalHeight;
      const g = cv.getContext("2d");
      g.drawImage(globe, 0, 0);
      TEX = { w: cv.width, h: cv.height, data: g.getImageData(0, 0, cv.width, cv.height).data };
      makeGrain();
      window.__ready = true;
    });
}
function makeGrain() {
  const c = document.getElementById("grainC"), g = c.getContext("2d"), r = rng(7);
  const d = g.createImageData(512, 512);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  document.getElementById("grain").style.background = `url(${c.toDataURL()})`;
}

      kin(title, t, 63.2, { mode: "slideR", stg: .03, dur: .4, out: 67.6, od: .3 });
      // 63–67.6: the admin.
      const aIn = Ez.back(P(t, 63.2, 63.8)), aOut = Ez.in(P(t, 67.2, 67.7));
      // Into the Sync now card: its button, bar and result sit at about
      // (370, 230) of the 1280-wide admin, i.e. (-211, -62) from the window's centre.
      const zoomIn = Ez.io(P(t, 65.3, 66.0)), Z = 1.9;
      S(aw, { s: lerp(.6, 1, aIn) * lerp(1, Z, zoomIn) * (1 - aOut * .7), o: P(t, 63.2, 63.4) * (1 - aOut), x: 540 + 211 * Z * zoomIn, y: 960 + 62 * Z * zoomIn - aOut * 600, rx: (1 - Ez.out(P(t, 63.2, 63.9))) * 25, p: 2000 });
      S(cap, { o: P(t, 63.6, 64) * (1 - P(t, 65.2, 65.5)), y: 1460 + (1 - Ez.out(P(t, 63.6, 64.1))) * 40 });
      const step = t < 64.65 ? 0 : t < 65.5 ? 1 : t < 66.3 ? 2 : 3;
      imgs.forEach((im, i) => { im.style.opacity = i === step ? 1 : 0; });
      const cx = tapA.x * k1, cy = tapA.y * k1;
      const ck = Ez.io(P(t, 63.7, 64.45));
      cursor.style.transform = `translate(${lerp(820, cx - 6, ck)}px, ${lerp(620, cy - 4, ck)}px) scale(${t > 64.5 && t < 64.62 ? .85 : 1})`;
      const rq = P(t, 64.5, 65.0);
      ring.style.transform = `translate(${cx}px, ${cy}px) scale(${lerp(.3, 2.2, Ez.out(rq))})`;
      ring.style.opacity = rq > 0 && rq < 1 ? 1 - rq : 0;
      S(badge, { o: P(t, 66.35, 66.55) * (1 - aOut), s: lerp(2.2, 1, Ez.back(P(t, 66.35, 66.7))), r: -6, x: 700, y: 1480 - aOut * 600 });
      // 67.6–76: the pipeline.
      const pin = (i) => P(t, 67.6 + i * .25, 68.0 + i * .25);
      nodes.forEach((n, i) => S(n.e, { o: pin(i), x: lerp(i % 2 ? 1300 : -200, 400, Ez.expo(pin(i))), s: lerp(.8, 1, Ez.out(pin(i))) }));
      lines.forEach((l, i) => {
        l.style.opacity = P(t, 68.3 + i * .2, 68.6 + i * .2);
        l.style.strokeDashoffset = String(-t * 60);
      });
      // Requests: worker → YouTube, one after another.
      calls.forEach((c, i) => {
        const k = P(t, 68.6 + i * .45, 69.2 + i * .45);
        S(c, { x: 400, y: along(nodes[1].y - 90, nodes[0].y + 90, Ez.io(k)), o: k > 0 && k < 1 ? 1 : 0, s: 1 });
      });
      const jk = P(t, 69.6 + calls.length * .2, 70.6 + calls.length * .2);
      S(json, { x: 400, y: along(nodes[0].y + 95, nodes[1].y - 95, Ez.io(jk)), o: jk > 0 && jk < 1 ? 1 : 0 });
      // The Shorts checks: dots up to YouTube and back, coloured by the answer.
      probes.forEach((p, i) => {
        const a = 70.4 + i * .06;
        const up = P(t, a, a + .45), dn = P(t, a + .55, a + 1.0);
        const isShort = i < st.shorts;
        const x = 400 + (i - (st.probed - 1) / 2) * 50;
        const y = dn > 0 ? lerp(nodes[0].y + 90, nodes[1].y - 120, Ez.io(dn)) : lerp(nodes[1].y - 90, nodes[0].y + 90, Ez.io(up));
        p.style.background = dn > 0 ? (isShort ? RED : CYAN) : "#fff";
        S(p, { x, y, o: up > 0 && t < 73 ? 1 : 0, s: dn >= 1 ? 1.3 : 1 });
      });
      S(probeL, { o: win(t, 70.3, 72.6, .2, .3) });
      S(verdict, { o: win(t, 71.6, 72.8, .2, .3) });
      // Rows into the database.
      const uk = P(t, 72.4, 73.3);
      S(upsert, { x: 470, y: along(nodes[1].y + 95, nodes[2].y - 95, Ez.io(uk)), o: uk > 0 && uk < 1 ? 1 : 0 });
      S(rowsBox, { o: P(t, 72.9, 73.2) });
      rows.forEach((r, i) => {
        const k = P(t, 73.0 + i * .07, 73.2 + i * .07);
        r.style.opacity = k; r.style.transform = `translateX(${(1 - Ez.out(k)) * 80}px)`;
      });
      rowsBox.scrollTop = 0;
      rowsBox.firstChild && (rowsBox.style.paddingTop = "0");
      [...rowsBox.children].forEach((r) => { r.style.marginTop = ""; });
      if (rows[0]) rows[0].style.marginTop = `${-Math.max(0, (t - 73.6) * 120)}px`;
      // …and onto the page.
      S(grid, { o: P(t, 74.2, 74.5), x: 905 });
      gridTiles.forEach((g, i) => { const k = P(t, 74.4 + i * .05, 74.6 + i * .05); g.style.transform = `scale(${Ez.back(k)})`; g.style.opacity = k; });
      meter.innerHTML = `API quota: <b style="color:#fff">${Math.round(st.quota * P(t, 68.6, 74))}</b> of 10,000 units a day`;
      S(meter, { o: P(t, 68.6, 69) });
      // The camera drifts down the pipeline.
      root.style.transform = "";
    };
  });

  // ============ 76–80  BEFORE / AFTER ============
  scene(76, 80.2, { bg: "#071328", chapter: "05 · Under the hood", enter: "wipeDiag", exit: "zoomOut" }, (root) => {
    const top = el(root, "", "", "position:absolute;left:0;right:0;top:0;height:960px;background:#e8e2d4;color:#2a2118;overflow:hidden");
    const bot = el(root, "", "", "position:absolute;left:0;right:0;bottom:0;height:960px;background:#071328;color:#e6f7ff;overflow:hidden");
    const tLab = el(top, "typer", "Before", "position:absolute;left:70px;top:150px;font-size:70px");
    const tNum = el(top, "bebas", "", "position:absolute;left:66px;top:250px;font-size:330px;color:#9a3412");
    const tTxt = el(top, "typer", "things copied by hand.<br>Views go stale. Every new upload: again.", "position:absolute;left:74px;top:590px;font-size:44px;line-height:1.35;white-space:normal;width:940px");
    const bLab = el(bot, "chakra", "After", `position:absolute;left:70px;top:90px;font-size:70px;color:${CYAN}`);
    const bNum = el(bot, "bebas", "1", "position:absolute;left:66px;top:180px;font-size:330px;color:#fff;text-shadow:0 0 50px rgba(103,232,249,.6)");
    const bTxt = el(bot, "jb", "click. Views refresh on every sync,<br>Shorts sort themselves,<br>and nothing is ever deleted.", "position:absolute;left:74px;top:520px;font-size:42px;line-height:1.4;white-space:normal;width:940px");
    const strike = el(top, "", "", "position:absolute;left:50px;top:420px;height:16px;background:#c81e1e;border-radius:8px;width:0;transform:rotate(-4deg)");
    const divider = el(root, "", "", `position:absolute;left:0;top:952px;height:16px;background:${CYAN};box-shadow:0 0 30px ${CYAN};width:0`);
    return (t) => {
      const total = F.chores.length * st.count;
      tNum.textContent = fmt(total * Ez.out(P(t, 76.2, 76.9)));
      [tLab, tNum, tTxt].forEach((e, i) => { const k = P(t, 76.1 + i * .15, 76.5 + i * .15); e.style.opacity = k; e.style.transform = `translateX(${(1 - Ez.expo(k)) * -300}px)`; });
      [bLab, bNum, bTxt].forEach((e, i) => { const k = P(t, 78.4 + i * .15, 78.8 + i * .15); e.style.opacity = k; e.style.transform = `translateX(${(1 - Ez.expo(k)) * 300}px)`; });
      strike.style.width = `${Ez.out(P(t, 78.9, 79.3)) * 760}px`;
      divider.style.width = `${Ez.io(P(t, 76, 76.6)) * 1080}px`;
      top.style.filter = `grayscale(${P(t, 78.9, 79.5)})`;
    };
  });

  // ============ 80–90  BACK OUT, AND THE ADDRESS ============
  scene(80, 90, { chapter: "06 · See you there" }, (root) => {
    const made = at(split(el(root, "c anton", "Made in Pune.", "font-size:150px;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.8)")), 540, 360);
    const more = at(split(el(root, "c playi", "For every upload still to come.", "font-size:62px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8)")), 540, 500);
    const url = at(el(root, "c", "", `font:700 66px 'Space Grotesk';color:#fff;padding:26px 48px;border-radius:999px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.5);box-shadow:0 0 50px rgba(225,29,42,.35)`), 540, 1380);
    const sub = at(el(root, "c", `<span style="display:inline-block;width:44px;height:44px;vertical-align:middle">${ICON.play("#fff")}</span><span style="vertical-align:middle;margin-left:14px">Subscribe · ${esc(F.channel.handle)}</span>`,
      `font:800 40px Inter;color:#fff;background:${RED};padding:22px 40px;border-radius:18px;box-shadow:0 20px 50px rgba(225,29,42,.45)`), 540, 1540);
    const sign = at(el(root, "c", `<img src="${F.sign}" style="height:110px">`), 540, 1690);
    const big = at(split(el(root, "c anton", "Videos.", "font-size:230px;color:#fff;text-shadow:0 0 60px rgba(225,29,42,.55)")), 540, 330);
    const recap = at(el(root, "c sg", `${fmt(st.count)} videos · ${fmt(st.shorts)} Shorts · ${fmt(st.views)} views`, "font-size:44px;color:#fff;opacity:.9;text-shadow:0 2px 14px rgba(0,0,0,.8)"), 540, 490);
    const credits = at(el(root, "c plex", esc(F.credits.line), "font-size:18px;color:rgba(255,255,255,.55);white-space:normal;width:960px;text-align:center;line-height:1.5"), 540, 1835);
    return (t) => {
      kin(made, t, 80.6, { mode: "rise", stg: .05, dur: .5, out: 84.2, od: .3 });
      kin(more, t, 82.3, { mode: "rise", stg: .02, dur: .5, out: 84.2, od: .3 });
      kin(big, t, 84.7, { mode: "slam", stg: .05, dur: .4 });
      S(recap, { o: P(t, 85.4, 85.8), y: 490 + (1 - Ez.out(P(t, 85.4, 85.9))) * 30 });
      typed(url, `${F.host}/videos`, t, 84.9, 16, true);
      S(url, { o: P(t, 84.7, 84.9), s: lerp(.6, 1, Ez.back(P(t, 84.7, 85.1))) });
      S(sub, { o: P(t, 86.2, 86.5), y: lerp(1640, 1540, Ez.back(P(t, 86.2, 86.7))), s: 1 + .03 * Math.sin((t - 86) * 6) * P(t, 86.7, 87) });
      S(sign, { o: P(t, 86.8, 87.3) * .95 });
      S(credits, { o: P(t, 87.4, 87.9) });
      root.style.opacity = 1 - P(t, 89.4, 90);
    };
  });
}

// ---------------------------------------------------------------- effects
function drawFx(t) {
  const c = document.getElementById("fx"), g = c.getContext("2d");
  g.clearRect(0, 0, W, H);
  // Confetti from the ribbon: thrown, falling, tumbling — position from t alone.
  if (t >= 36 && t < 40.5) {
    const r = rng(36), q = t - 36;
    const cols = ["#f5c451", "#fff1b8", "#e11d2a", "#ffffff", "#ff7a59", "#ffd166"];
    for (let k = 0; k < 260; k += 1) {
      const a = -Math.PI / 2 + (r() - .5) * 2.6, v = 900 + r() * 1700, drag = 1.6 + r() * 1.2;
      const vx = Math.cos(a) * v, vy = Math.sin(a) * v;
      const e = (1 - Math.exp(-drag * q)) / drag;
      const x = 540 + vx * e + Math.sin(q * 4 + k) * 30, y = 1130 + vy * e + 520 * q * q * .55;
      const rot = q * (4 + r() * 8) + k, w = 14 + r() * 16, h = 8 + r() * 10;
      const col = cols[k % cols.length];
      if (y > H + 40) continue;
      g.save(); g.translate(x, y); g.rotate(rot); g.scale(1, Math.cos(q * 6 + k));
      g.fillStyle = col; g.globalAlpha = 1 - P(t, 39.6, 40.4);
      g.fillRect(-w / 2, -h / 2, w, h); g.restore();
    }
  }
  // Sparkles around the wrapped gift.
  if (t >= 34 && t < 40) {
    const r = rng(12);
    for (let k = 0; k < 26; k += 1) {
      const x = 160 + r() * 760, y = 500 + r() * 1300, ph = r() * 6, s = (Math.sin(t * 5 + ph) + 1) / 2;
      g.fillStyle = `rgba(255,236,170,${(s * .9).toFixed(3)})`;
      g.beginPath(); g.moveTo(x, y - 14 * s); g.lineTo(x + 4, y); g.lineTo(x, y + 14 * s); g.lineTo(x - 4, y); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(x - 14 * s, y); g.lineTo(x, y + 4); g.lineTo(x + 14 * s, y); g.lineTo(x, y - 4); g.closePath(); g.fill();
    }
  }
  // Stars behind the timeline's highlight; data sparks on the pipeline.
  if (t >= 67.6 && t < 76.2) {
    const r = rng(68);
    for (let k = 0; k < 60; k += 1) {
      const x = 80 + r() * 920, sp = 200 + r() * 400, y = ((r() * 1920 + (t - 67.6) * sp) % 1920);
      g.fillStyle = `rgba(103,232,249,${(.15 + r() * .25).toFixed(3)})`;
      g.fillRect(x, y, 3, 18);
    }
  }
}

// ---------------------------------------------------------------- the frame
window.renderAt = async function renderAt(t) {
  const E = await drawEarth(t);
  const cur = SCENES.filter((s) => t >= s.a - .2 && t <= s.b + .2);
  SCENES.forEach((s) => {
    const on = cur.includes(s);
    s.root.style.display = on ? "block" : "none";
    if (on) { transition(s, t); s.update(t, E); }
  });
  drawFx(t);

  // Camera: a kick on each impact.
  let sx = 0, sy = 0, rs = 0;
  IMPACTS.forEach((ti) => { const q = t - ti; if (q >= 0 && q < .6) { const a = 24 * Math.exp(-q * 7); sx += (hash(Math.floor(t * 30) + ti) - .5) * a; sy += (hash(Math.floor(t * 30) * 3 + ti) - .5) * a; rs += (hash(Math.floor(t * 30) * 7) - .5) * a * .05; } });
  cam.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(${rs.toFixed(2)}deg)`;

  let fl = 0;
  IMPACTS.forEach((ti) => { const q = t - ti; if (q >= 0 && q < .5) fl = Math.max(fl, Math.exp(-q * 9) * (ti === 12.6 ? .4 : .9)); });
  if (t >= 15.15 && t < 15.5) fl = Math.max(fl, .6 * (1 - P(t, 15.2, 15.5)));
  document.getElementById("flash").style.opacity = fl.toFixed(3);

  const gr = rng(Math.floor(t * 30));
  document.getElementById("grain").style.transform = `translate(${Math.floor(gr() * 200 - 100)}px,${Math.floor(gr() * 200 - 100)}px)`;

  const main = SCENES.slice().reverse().find((s) => t >= s.a) || SCENES[0];
  const chap = SCENES.slice().reverse().find((s) => s.chapter && t >= s.a);
  const hc = document.getElementById("hudChap"), hs = document.getElementById("hudSite"), hb = document.getElementById("hudbar");
  hc.textContent = chap ? chap.chapter : "";
  hs.textContent = F.host;
  const ink = main.ink;
  hc.style.color = hs.style.color = ink === "#fff" ? "rgba(255,255,255,.7)" : "rgba(19,16,30,.6)";
  hb.style.background = ink === "#fff" ? "rgba(255,255,255,.7)" : "rgba(19,16,30,.5)";
  hb.style.width = `${(972 * t / 90).toFixed(1)}px`;
  const hudOn = t > 1.2 && t < 88.6 ? 1 : 0;
  document.getElementById("hud").style.opacity = hudOn;
  hb.style.opacity = hudOn;
  document.getElementById("vig").style.opacity = ink === "#fff" ? 1 : .25;
};
</script>
