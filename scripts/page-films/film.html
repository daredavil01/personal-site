        <path id="sw" fill="${ochre}" opacity=".85"/>
        <line id="h" x1="280" y1="280" x2="280" y2="70" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`, "left:90px;top:230px;transform-origin:0 0;");
      dial.firstChild.style.transform = "scale(.6)"; dial.firstChild.style.transformOrigin = "0 0";
      const sw = dial.querySelector("#sw"), hand = dial.querySelector("#h");
      const hrs = el(root, "a ctr mono", "", `top:1180px;font-size:180px;font-weight:700;color:#fff;letter-spacing:-6px;`);
      const lab = el(root, "a ctr lbl", "hours on foot", `top:1390px;color:${ochre};`);
      const name = el(root, "a ctr serif", esc(L.name), `top:1470px;font-size:100px;color:#fff;`);
      const when = el(root, "a ctr mono", day(L.date), `top:1600px;font-size:34px;color:${mist};`);
      return (lt, d) => {
        root.style.opacity = inout(lt, d, .3, .3);
        burns(ph, P(lt, 0, d), 4);
        const k = Ez.io(P(lt, .3, 3.2));
        const hh = L.hours * k;
        const ang = (hh / 24) * 360;
        const rad = ((ang - 90) * Math.PI) / 180;
        sw.setAttribute("d", ang > 0 ? `M280 280 L280 30 A250 250 0 ${ang > 180 ? 1 : 0} 1 ${280 + Math.cos(rad) * 250} ${280 + Math.sin(rad) * 250} Z` : "");
        hand.setAttribute("transform", `rotate(${ang} 280 280)`);
        hrs.textContent = `${Math.floor(hh)}h`;
        S(lab, P(lt, .5, .9));
        S(name, P(lt, 2.4, 2.8), 0, (1 - Ez.out(P(lt, 2.4, 3))) * 30);
        S(when, P(lt, 2.8, 3.2));
      };
    },
  });

  // 26–30 — the end
  scenes.push({
    a: 26, b: 30, say: `Some take two hours. One took ${L ? L.hours : "a whole night"}. ${D.hours} hours on the trail. sankettambare.in/treks`,
    build(root) {
      el(root, "a", "", `left:0;top:0;width:${W}px;height:${H}px;background:linear-gradient(${forest}, #1d3527);`);
      const lay = svg(root, W, 700, `<path d="${ridge(W, 700, 21, .6)}" fill="#152a1e"/>`, "left:0;top:1220px;");
      const a1 = el(root, "a ctr serif", "Some take two hours.", `top:600px;font-size:104px;color:${fg};`);
      const a2 = el(root, "a ctr serif it", L ? `One took ${L.hours}.` : "", `top:730px;font-size:104px;color:${ochre};`);
      const a3 = el(root, "a ctr mono", `${D.hours} hours on the trail · ${D.count} forts · ${D.years} years`, `top:930px;font-size:36px;color:${muted};`);
      return (lt) => {
        S(lay, 1, 0, (1 - Ez.out(P(lt, 0, 1))) * 200);
        S(a1, P(lt, .1, .5), 0, (1 - Ez.out(P(lt, .1, .7))) * 30);
        S(a2, P(lt, .8, 1.2), 0, (1 - Ez.out(P(lt, .8, 1.4))) * 30);
        S(a3, P(lt, 1.4, 1.8));
      };
    },
  });

  return {
    theme: { bg: forest, fg, accent: ochre, muted, rail: "rgba(255,255,255,.14)", grain: .07, vig: "rgba(0,0,0,.5)" },
    route: "/treks", label: "Treks", scenes, flashes: [],
  };
};

// ---------------------------------------------------------------- boot
let FILM = null;
async function boot(name) {
  const make = FILMS[name];
  if (!make) throw new Error(`unknown film ${name}`);
  FILM = make(window.FILM[name]);
  const th = FILM.theme;
  const root = document.documentElement.style;
  root.setProperty("--bg", th.bg); root.setProperty("--fg", th.fg); root.setProperty("--accent", th.accent);
  root.setProperty("--muted", th.muted); root.setProperty("--rail", th.rail); root.setProperty("--grain", th.grain);
  root.setProperty("--vig", th.vig); root.setProperty("--flash", th.flash || "#fff");
  document.getElementById("grain").style.backgroundImage = `url(${makeGrain(5)})`;
  document.getElementById("tag").innerHTML = `sankettambare.in · <b>${esc(FILM.label)}</b>`;
  const stage = document.getElementById("stage");
  FILM.scenes.forEach((s) => {
    s.root = el(stage, "scene");
    s.draw = s.build(s.root);
  });
  window.FLASHES = FILM.flashes;
  window.CUES = FILM.scenes.filter((s) => s.say).map((s) => [Math.max(0, s.a), Math.min(DUR, s.b), s.say]);
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? (im.decode ? im.decode().catch(() => {}) : null) : new Promise((r) => { im.onload = im.onerror = r; }))));
  window.renderAt = renderAt;
  window.__ready = true;
}

function renderAt(t) {
  FILM.scenes.forEach((s) => {
    const on = t >= s.a && t < s.b;
    s.root.style.display = on ? "block" : "none";
    if (on) s.draw(t - s.a, s.b - s.a, t);
  });
  document.querySelector("#prog i").style.width = `${(t / DUR) * 100}%`;
  const end = P(t, 26.4, 27);
  const url = document.getElementById("url");
  url.textContent = `sankettambare.in${FILM.route}`;
  url.style.opacity = end;
  url.style.transform = `translateY(${(1 - Ez.out(end)) * 30}px)`;
  document.getElementById("tag").style.opacity = P(t, .2, .8) * (1 - P(t, 26, 26.4));
  const fl = FILM.flashes.reduce((m, at) => Math.max(m, t >= at ? 1 - P(t, at, at + .25) : 0), 0);
  document.getElementById("flash").style.opacity = fl * .55;
  document.getElementById("grain").style.transform = `translate(${(Math.floor(t * 24) * 37) % 200 - 100}px, ${(Math.floor(t * 24) * 53) % 200 - 100}px)`;
}
</script>
