<!doctype html>
<!--
  The trailer, as one page that draws any moment of itself: renderAt(t) sets
  every element from the time alone, so frames render in any order, on any
  number of tabs, and always come out the same. scripts/trailer/render.mjs
  seeks it frame by frame and screenshots each one.

  Music is 120 BPM (score.mjs): a beat is 0.5 s, a bar 2 s, and every cut
  below lands on one. The numbers come from window.TRAILER (data.js, written
  by render.mjs from the live /api/stats); nothing here is typed in.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Noto+Serif:wght@700;900&family=Tiro+Devanagari+Marathi&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06070b; }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
  .layer, .scene { position: absolute; inset: 0; }
  .scene { display: none; transform-origin: 540px 960px; }
  .c { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .ch { display: inline-block; white-space: pre; }
  .anton { font-family: Anton, sans-serif; text-transform: uppercase; line-height: .92; letter-spacing: 1px; }
  .serif { font-family: "Noto Serif", serif; font-weight: 900; line-height: .95; letter-spacing: -2px; }
  .inst { font-family: "Instrument Serif", serif; font-style: italic; line-height: 1; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .deva { font-family: "Tiro Devanagari Marathi", serif; }
  .lbl { font-family: Inter; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; font-size: 24px; }
  .chip { padding: 14px 26px; border-radius: 999px; font: 800 26px Inter; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 14px; }
  .glass { background: rgba(14,16,24,.72); border: 1.5px solid rgba(255,255,255,.16); box-shadow: 0 30px 60px rgba(0,0,0,.45); backdrop-filter: blur(14px); }
  .outline { color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.85); }
  .sweep { background: linear-gradient(100deg, #fff 0%, #fff 42%, #ffd28a 50%, #fff 58%, #fff 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* phone */
  .phone { width: 600px; height: 1240px; border-radius: 86px; background: linear-gradient(145deg, #2b2d33, #0b0c10 40%, #1b1c21); padding: 20px;
    box-shadow: 0 0 0 2px #45474f, 0 70px 140px rgba(0,0,0,.65), 0 0 120px var(--glow, rgba(0,0,0,0)); }
  .scr { width: 560px; height: 1200px; border-radius: 66px; overflow: hidden; position: relative; background: #fff; }
  .scr img { position: absolute; left: 0; top: 64px; width: 560px; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 8px 52px 0; font: 700 22px Inter; z-index: 2; }
  .island { position: absolute; top: 34px; left: 50%; width: 156px; height: 42px; margin-left: -78px; background: #000; border-radius: 21px; z-index: 3; }
  .glare { position: absolute; inset: 20px; border-radius: 66px; background: linear-gradient(118deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 32%); z-index: 4; pointer-events: none; }
  .ring { position: absolute; inset: 20px; border-radius: 66px; z-index: 5; }

  /* tiles */
  .tile { width: 460px; height: 250px; border-radius: 34px; padding: 30px 34px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .tile .num { font: 400 128px Anton; line-height: 1; }
  .tile .cap { font: 800 24px Inter; letter-spacing: .2em; text-transform: uppercase; opacity: .9; margin-top: 10px; }
  .tile svg { position: absolute; right: 26px; top: 26px; width: 64px; height: 64px; opacity: .85; }
  .tile .glint { position: absolute; top: -40%; bottom: -40%; width: 120px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: rotate(20deg); }

  #grain { position: absolute; inset: -200px; opacity: .085; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.72) 100%); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .corner { position: absolute; width: 54px; height: 54px; border-color: #ff4a3d; border-style: solid; border-width: 0; }
  #blinds div, #slices div { position: absolute; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
  <div id="cam"></div>
  <div id="blinds" class="layer"></div>
  <div id="slices" class="layer"></div>
  <canvas id="grainC" width="512" height="512" style="display:none"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="hud"></div>
  <div id="flash"></div>
</div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const s = document.createElement("script");
  s.src = params.get("data") || "data.js";
  s.onload = () => boot().catch((e) => { window.__error = String(e && e.stack || e); });
  s.onerror = () => { window.__error = "data.js failed to load"; };
  document.head.appendChild(s);
})();

// ---------------------------------------------------------------- maths
const W = 1080, H = 1920, BEAT = 0.5;
const cl = (x) => Math.max(0, Math.min(1, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const Ez = {
  out: (x) => 1 - (1 - x) ** 3,
  in: (x) => x * x * x,
  io: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  expoIn: (x) => (x <= 0 ? 0 : 2 ** (10 * x - 10)),
  back: (x) => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1),
};
const win = (t, a, b, fi = .3, fo = .3) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
}
const hash = (n) => { const r = rng(n * 9973 + 17); return r(); };
const fmt = (n) => Math.round(n).toLocaleString("en-IN");
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})`; };
const isDeva = (s) => /[ऀ-ॿ]/.test(s);

// ---------------------------------------------------------------- dom kit
const cam = document.getElementById("cam");
function el(parent, cls, html = "", css = "") {
  const d = document.createElement("div");
  d.className = cls;
  if (html) d.innerHTML = html;
  if (css) d.style.cssText += css;
  parent.appendChild(d);
  return d;
}
// Places an element by its centre. Every transform is rebuilt from scratch.
function S(e, o = {}) {
  const st = e.style;
  const x = o.x ?? e._x ?? 540, y = o.y ?? e._y ?? 960;
  let tf = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`;
  if (o.p) tf += ` perspective(${o.p}px)`;
  if (o.rx) tf += ` rotateX(${o.rx.toFixed(2)}deg)`;
  if (o.ry) tf += ` rotateY(${o.ry.toFixed(2)}deg)`;
  if (o.r) tf += ` rotate(${o.r.toFixed(2)}deg)`;
  if (o.sk) tf += ` skewX(${o.sk.toFixed(2)}deg)`;
  tf += ` scale(${(o.s ?? 1).toFixed(4)}${o.sy != null ? `,${o.sy.toFixed(4)}` : ""})`;
  st.transform = tf;
  const op = o.o ?? 1;
  st.opacity = op.toFixed(3);
  st.visibility = op <= 0.001 ? "hidden" : "visible";
  st.filter = o.blur > 0.2 ? `blur(${o.blur.toFixed(1)}px)` : (o.f || "");
  if (o.clip !== undefined) st.clipPath = o.clip;
}
const at = (e, x, y) => { e._x = x; e._y = y; S(e, { o: 0 }); return e; };
// Text split into letters (words for Devanagari, whose letters join).
function split(e) {
  const txt = e.textContent;
  const parts = isDeva(txt) ? txt.split(/(\s+)/) : [...txt];
  e.innerHTML = parts.map((c) => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
  e._ch = [...e.children];
  return e;
}
// Kinetic type: each letter enters in turn, and all leave together at `out`.
function kin(e, t, t0, { mode = "rise", stg = .035, dur = .55, out = Infinity, od = .25 } = {}) {
  const n = e._ch.length;
  const ex = Ez.in(P(t, out - od, out));
  e._ch.forEach((c, i) => {
    const k = P(t, t0 + i * stg, t0 + i * stg + dur);
    const q = mode === "drop" || mode === "pop" ? Ez.back(k) : Ez.expo(k);
    let tf = "", f = 0;
    if (mode === "rise") { tf = `translateY(${(1 - q) * 0.9}em) rotate(${(1 - q) * 9}deg)`; f = (1 - k) * 12; }
    if (mode === "slam") { tf = `scale(${lerp(2.4, 1, q)})`; f = (1 - k) * 18; }
    if (mode === "slideL") { tf = `translateX(${(1 - q) * -2}em) skewX(${(1 - q) * -25}deg)`; f = (1 - k) * 14; }
    if (mode === "slideR") { tf = `translateX(${(1 - q) * 2}em) skewX(${(1 - q) * 25}deg)`; f = (1 - k) * 14; }
    if (mode === "flip") { tf = `perspective(600px) rotateX(${(1 - q) * -100}deg)`; }
    if (mode === "drop") { tf = `translateY(${(1 - q) * -1.6}em)`; }
    if (mode === "pop") { tf = `scale(${q})`; }
    if (ex > 0) { tf += ` translateY(${-ex * 0.5}em)`; f += ex * 14; }
    c.style.transform = tf;
    c.style.opacity = (Math.min(k * 1.6, 1) * (1 - ex)).toFixed(3);
    c.style.filter = f > .3 ? `blur(${f.toFixed(1)}px)` : "";
  });
  e.style.opacity = t < t0 - .05 || ex >= 1 ? 0 : 1;
  e.style.visibility = t < t0 - .05 || ex >= 1 ? "hidden" : "visible";
}
// A number that counts up to `n` over [t0, t0+d].
const count = (e, t, t0, d, n, suffix = "") => { e.textContent = fmt(n * Ez.out(P(t, t0, t0 + d))) + suffix; };

// Phone: a mockup holding any number of shots; show one, scroll it.
function phone(parent, names, { bar = "#ffffff", ink = "#111" } = {}) {
  const ph = el(parent, "phone c");
  const scr = el(ph, "scr");
  scr.style.background = bar;
  ph._img = {};
  names.forEach((nm) => {
    const im = document.createElement("img");
    im.src = T.shots[nm];
    scr.appendChild(im);
    ph._img[nm] = im;
  });
  el(scr, "bar", `<span style="color:${ink}">9:41</span><span style="color:${ink};letter-spacing:4px">▮▮▮ ◔</span>`, `background:${bar}`);
  el(ph, "island");
  el(ph, "glare");
  ph._ring = el(ph, "ring");
  return ph;
}
// shots: { name: opacity }, scroll in screen px (clamped to the shot's length).
function show(ph, shots, scroll = 0, zoom = 1, pan = 0) {
  Object.entries(ph._img).forEach(([nm, im]) => {
    const o = shots[nm] || 0;
    im.style.opacity = o;
    im.style.visibility = o > 0 ? "visible" : "hidden";
    if (o > 0) {
      const max = Math.max(0, im.naturalHeight * (560 / im.naturalWidth) - 1136);
      im.style.transform = `translateY(${-Math.min(scroll, max)}px) translateX(${pan}px) scale(${zoom})`;
      im.style.transformOrigin = "50% 40%";
    }
  });
}
const ring = (ph, color, o) => { ph._ring.style.boxShadow = o > 0 ? `inset 0 0 0 ${6 * o}px ${color}, 0 0 ${80 * o}px ${color}` : ""; };

// Simple line illustrations, drawn on with stroke-dashoffset.
const ICON = {
  run: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2 1 4M6 12l3-4 4 1 3 4 3 1M11 15l2-6"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 21l7-12 4 6 3-4 6 10z"/><path d="M13 9V2l5 2-5 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-5a2 2 0 00-2 2"/><path d="M20 4v14h-7"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 21c4-1 6-3 8-6l8-11-3-1-9 10c-2 3-3 5-4 8zM13 7l3 2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 4h16v12H9l-5 4z"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 3h8l10 10-8 8L3 11z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  medal: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="15" r="6"/><path d="M8 3l4 6 4-6"/></svg>',
};

// ---------------------------------------------------------------- scenes
// a, b: on screen; enter/exit: how it arrives and leaves; tint: background.
const SCENES = [];
function scene(a, b, { enter = "cut", exit = "cut", tint = ["#0a0b12", "#0a0b12"], chapter = null }, build) {
  const root = el(cam, "scene");
  const sc = { a, b, enter, exit, tint, chapter, root };
  sc.update = build(root, sc);
  SCENES.push(sc);
  return sc;
}
// Scene-level transitions, applied to the scene's root.
function transition(sc, t) {
  const o = { x: 540, y: 960, s: 1, o: 1, blur: 0, clip: "none", r: 0 };
  const ei = P(t, sc.a - .15, sc.a + .3), eo = P(t, sc.b - .3, sc.b + .15);
  switch (sc.enter) {
    case "whip": o.x += (1 - Ez.expo(ei)) * 1300; o.blur += (1 - ei) * 40; o.sk = (1 - ei) * -12; break;
    case "whipUp": o.y += (1 - Ez.expo(ei)) * 2100; o.blur += (1 - ei) * 40; break;
    case "zoom": o.s *= lerp(.35, 1, Ez.expo(ei)); o.o *= ei; o.blur += (1 - ei) * 30; o.r += (1 - Ez.expo(ei)) * -8; break;
    case "circle": { const k = Ez.io(P(t, sc.a, sc.a + .55)); o.clip = `circle(${(k * 1250).toFixed(0)}px at 540px 960px)`; break; }
    case "wipeUp": { const k = Ez.io(P(t, sc.a - .1, sc.a + .45)); o.clip = `inset(${((1 - k) * 100).toFixed(1)}% 0 0 0)`; break; }
    case "fade": o.o *= P(t, sc.a - .2, sc.a + .5); break;
    default: break;
  }
  switch (sc.exit) {
    case "whip": o.x -= Ez.expoIn(eo) * 1300; o.blur += eo * 40; o.sk = (o.sk || 0) + eo * 12; break;
    case "whipUp": o.y -= Ez.expoIn(eo) * 2100; o.blur += eo * 40; break;
    case "zoomThrough": o.s *= lerp(1, 6, Ez.expoIn(eo)); o.o *= 1 - eo; o.blur += eo * 20; break;
    case "zoomOut": o.s *= lerp(1, .4, Ez.in(eo)); o.o *= 1 - eo; o.blur += eo * 25; break;
    case "fade": o.o *= 1 - eo; break;
    default: break;
  }
  S(sc.root, o);
}

function boot() {
  window.T = window.TRAILER;
  buildAll();
  buildNet();
  const imgs = [...document.images].map((im) => (im.complete ? im.decode().catch(() => {}) : new Promise((r) => { im.onload = () => im.decode().then(r, r); im.onerror = r; })));
  const faces = ["400 40px Anton", "italic 40px 'Instrument Serif'", "900 40px 'Noto Serif'", "800 40px Inter", "700 40px 'JetBrains Mono'", "40px 'Tiro Devanagari Marathi'"];
  return Promise.all([...imgs, ...faces.map((f) => document.fonts.load(f, "Aaमराठी"))])
    .then(() => document.fonts.ready)
    .then(() => { makeGrain(); window.__ready = true; });
}

function makeGrain() {
  const c = document.getElementById("grainC"), g = c.getContext("2d"), r = rng(7);
  const d = g.createImageData(512, 512);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  document.getElementById("grain").style.background = `url(${c.toDataURL()})`;
}

function buildAll() {
  const D = T;
  const RED = "#ff3b30", SAFF = "#ffb020", IND = "#6366f1", SKY = "#38bdf8", GRN = "#22c55e", PINK = "#ec4899", PURP = "#a855f7", TEAL = "#14b8a6";

  // ============ 0–6  COLD OPEN: the numbers, on the heartbeat ============
  scene(0, 6.05, { tint: ["#0a0204", "#05060a"] }, (root) => {
    const slams = [
      [D.km, "kilometres run"], [D.treks, "forts climbed"], [D.books, "books read"],
      [D.micro, "short posts"], [null, "One person."], [null, "One website."],
    ].map(([n, label], i) => {
      const g = at(el(root, "c", "", "text-align:center"), 540, 930);
      const num = n != null ? el(g, "anton", "", `font-size:330px;color:${RED};text-shadow:0 0 60px rgba(255,59,48,.5)`) : null;
      const lab = split(el(g, "anton", label, `font-size:${n != null ? 92 : 168}px;margin-top:${n != null ? 10 : 0}px;letter-spacing:${n != null ? 8 : 2}px`));
      return { g, num, lab, n, t0: i };
    });
    const pre = at(el(root, "c lbl", "Sankettambare.in · presents", `color:rgba(255,255,255,.5);font-size:26px`), 540, 1500);
    return (t) => {
      slams.forEach(({ g, num, lab, n, t0 }) => {
        const k = P(t, t0, t0 + .28), out = P(t, t0 + .84, t0 + 1);
        S(g, { s: lerp(1.5, 1, Ez.expo(k)) * lerp(1, .9, out) + (t - t0) * .03, o: (t >= t0 ? 1 : 0) * (1 - out), blur: (1 - k) * 22 + out * 10 });
        if (num) count(num, t, t0, .45, n);
        kin(lab, t, t0 + .06, { mode: n != null ? "slideR" : "slam", stg: .02, dur: .35 });
      });
      S(pre, { o: win(t, .3, 5.6, .6, .4) * .9 });
    };
  });

  // ============ 6–10  TITLE: the name, and the dot that opens the world ============
  scene(6, 10.25, { tint: ["#1a0506", "#06070c"] }, (root) => {
    const halo = at(el(root, "c", `<svg width="640" height="640" viewBox="0 0 640 640"><circle cx="320" cy="320" r="300" fill="none" stroke="${RED}" stroke-width="3" stroke-dasharray="4 18"/><circle cx="320" cy="320" r="262" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="120 30 8 30"/></svg>`), 540, 560);
    const face = at(el(root, "c", `<div style="width:440px;height:440px;border-radius:50%;overflow:hidden;position:relative"><img src="${D.me}" style="width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(1.05)"><div style="position:absolute;inset:0;background:linear-gradient(160deg,${RED},#3a0b6b);mix-blend-mode:multiply"></div></div>`), 540, 560);
    const hub = split(at(el(root, "c lbl", "The Digital Hub", `color:${RED};font-size:30px`), 540, 870));
    const n1 = split(at(el(root, "c serif", "Sanket", "font-size:196px"), 540, 1070));
    const n2 = at(el(root, "c serif", `<span class="tx">Tambare</span><span class="dot" style="color:${RED};display:inline-block">.</span>`, "font-size:196px"), 540, 1265);
    const tx = split(n2.querySelector(".tx"));
    const dot = n2.querySelector(".dot");
    const sub = split(at(el(root, "c inst", "a life, archived in a database.", "font-size:78px;color:rgba(255,255,255,.88)"), 540, 1480));
    const portal = at(el(root, "c", "", `width:90px;height:90px;border-radius:50%;background:${RED}`), 540, 960);
    return (t) => {
      const k = Ez.expo(P(t, 6, 6.7)), gone = P(t, 9.25, 9.6);
      S(halo, { s: lerp(.6, 1, k) * (1 + .02 * Math.sin(t * 3)), r: t * 22, o: k * (1 - gone) });
      S(face, { s: lerp(.3, 1, Ez.back(P(t, 6.05, 6.7))), o: P(t, 6, 6.25) * (1 - gone), clip: `circle(${(Ez.out(P(t, 6, 6.6)) * 50).toFixed(1)}% at 50% 50%)` });
      kin(hub, t, 6.45, { mode: "flip", stg: .03, out: 9.5 });
      kin(n1, t, 6.3, { mode: "rise", stg: .06, dur: .6, out: 9.55 });
      kin(tx, t, 6.6, { mode: "rise", stg: .06, dur: .6, out: 9.55 });
      n1.style.opacity = n2.style.opacity = 1;

    const url = split(at(el(root, "c anton", "sankettambare.in", "font-size:128px;letter-spacing:3px"), 540, 1215));
    const cta = at(el(root, "c chip", "Enter the World  →", `background:${SAFF};color:#1d1100;font-size:40px;padding:30px 60px`), 540, 1390);
    const tail = at(el(root, "c", "Ask it anything · Read the Logbook · Get the letter", "font:600 32px Inter;opacity:.7"), 540, 1510);
    const black = at(el(root, "c", "", "width:1080px;height:1920px;background:#000"), 540, 960);
    return (t) => {
      const k = Ez.back(P(t, 84.05, 84.6));
      S(logo, { s: k, r: (1 - k) * -30, o: P(t, 84.05, 84.15) });
      S(sign, { o: 1, clip: `inset(0 ${(1 - Ez.io(P(t, 84.6, 85.9))) * 100}% 0 0)` });
      kin(url, t, 85.6, { mode: "drop", stg: .035, dur: .45 });
      const pulse = 1 + .05 * Math.max(0, Math.sin((t - 86.5) * Math.PI * 2));
      S(cta, { s: Ez.back(P(t, 86.5, 86.9)) * pulse, o: P(t, 86.5, 86.6) });
      cta.style.boxShadow = `0 0 ${40 + 40 * Math.sin(t * 6)}px rgba(255,176,32,.7)`;
      S(tail, { o: P(t, 87.1, 87.5), y: lerp(1540, 1510, Ez.out(P(t, 87.1, 87.6))) });
      S(black, { o: P(t, 89.1, 90) });
    };
  });

  // ---- HUD: corners, site, chapter, progress
  const hud = document.getElementById("hud");
  [["left:56px;top:56px", "border-left-width:6px;border-top-width:6px"], ["right:56px;top:56px", "border-right-width:6px;border-top-width:6px"],
    ["left:56px;bottom:56px", "border-left-width:6px;border-bottom-width:6px"], ["right:56px;bottom:56px", "border-right-width:6px;border-bottom-width:6px"]]
    .forEach(([pos, bw]) => el(hud, "corner", "", `${pos};${bw}`));
  window.hudSite = el(hud, "lbl", "● sankettambare.in", "position:absolute;left:130px;top:72px;font-size:20px;color:rgba(255,255,255,.75)");
  window.hudChap = el(hud, "lbl", "", "position:absolute;right:130px;top:72px;font-size:20px;color:rgba(255,255,255,.75);text-align:right");
  window.hudBar = el(hud, "", "", `position:absolute;left:130px;bottom:78px;height:4px;width:0;background:${RED}`);

  // ---- blinds and glitch slices (global transitions)
  const blinds = document.getElementById("blinds");
  window.blindEls = Array.from({ length: 9 }, (_, i) => el(blinds, "", "", `left:${i * 120}px;top:0;width:121px;height:1920px`));
  const slices = document.getElementById("slices");
  window.sliceEls = Array.from({ length: 14 }, () => el(slices, "", "", "left:0;width:1080px;mix-blend-mode:screen"));
}

// ---------------------------------------------------------------- global fx
// Times the picture is hit: flash, shake, particle burst (score.mjs booms on these).
const IMPACTS = [6, 10, 68, 76, 84];
const BLINDS = [[30, "#22c55e"], [38, "#ffb020"]];
const GLITCH = [42, 52, 60, 68, 72, 73, 74, 75];
const STARS = (() => { const r = rng(3); return Array.from({ length: 420 }, () => [r() * 2 - 1, r() * 2 - 1, r()]); })();
let NET = [];
const buildNet = () => {
  const r = rng(21);
  NET = window.TRAILER.tagNodes.map((n, i) => {
    const a = i * 2.39996, rad = 60 + Math.sqrt(i) * 64;
    return { ...n, x: 540 + Math.cos(a) * rad + (r() - .5) * 40, y: 1000 + Math.sin(a) * rad * 1.15 + (r() - .5) * 40, ph: r() * 6 };
  });
};

function grooving(t) { return (t >= 10 && t < 60) || (t >= 68 && t < 84); }

function drawFx(t) {
  const c = document.getElementById("fx"), g = c.getContext("2d");
  g.clearRect(0, 0, W, H);
  // Starfield: forward drift, warp streaks before each drop.
  const warp = Math.max(Ez.expoIn(P(t, 9.2, 10)) * (t < 10.3 ? 1 : 0), Ez.expoIn(P(t, 67.2, 68)) * (t < 68.2 ? 1 : 0), Ez.expoIn(P(t, 83.2, 84)) * (t < 84.2 ? 1 : 0));
  const starA = t < 10 ? 1 : t < 18 ? .25 : (t >= 60 && t < 68) ? .7 : t >= 76 ? 1 : .35;
  const speed = .05 + warp * 2.2;
  STARS.forEach(([sx, sy, sz], i) => {
    const z = ((sz - t * speed * .3 - (warp > 0 ? warp * warp * .6 : 0)) % 1 + 1) % 1 + .02;
    const x = 540 + (sx / z) * 260, y = 960 + (sy / z) * 260;
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) return;
    const a = Math.min(1, (1 - z) * 1.4) * starA;
    g.strokeStyle = g.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    if (warp > .05) {
      const z2 = z + warp * .12;
      g.lineWidth = 2.2 * (1 - z);
      g.beginPath(); g.moveTo(x, y); g.lineTo(540 + (sx / z2) * 260, 960 + (sy / z2) * 260); g.stroke();
    } else {
      g.beginPath(); g.arc(x, y, (1 - z) * 3 + .4, 0, 7); g.fill();
    }
  });
  // Heartbeat rings in the cold open.
  if (t < 6) for (let k = 0; k <= Math.floor(t); k += 1) {
    const q = t - k; if (q > 1.4) continue;
    g.strokeStyle = `rgba(255,59,48,${(1 - q / 1.4) * .7})`; g.lineWidth = 6 * (1 - q / 1.4);
    g.beginPath(); g.arc(540, 930, 120 + q * 700, 0, 7); g.stroke();
  }
  // Clouds drifting past the Atlas.
  if (t >= 10 && t < 18.3) {
    const r = rng(9);
    for (let k = 0; k < 7; k += 1) {
      const y = 300 + r() * 1400, sp = 60 + r() * 120, x = ((r() * 1600 + (t - 10) * sp) % 1700) - 300, s = .7 + r();
      g.fillStyle = `rgba(255,255,255,${.12 + r() * .1})`;
      [[0, 0, 90], [70, -30, 70], [130, 0, 80], [60, 20, 80]].forEach(([dx, dy, rr]) => { g.beginPath(); g.arc(x + dx * s, y + dy * s, rr * s, 0, 7); g.fill(); });
    }
  }
  // The Logbook's sky: English circles, Marathi diamonds, joined in order.
  if (t >= 38 && t < 42.2) {
    const r = rng(14), n = (window.TRAILER.essays || 100);
    let px = null, py = null;
    for (let k = 0; k < n; k += 1) {
      const x = 60 + r() * 960, y = 700 + r() * 1150, mr = r() < (window.TRAILER.essaysMr / n);
      const on = P(t, 38.4 + k * .025, 38.6 + k * .025);
      if (on <= 0) break;
      g.fillStyle = mr ? `rgba(232,89,12,${.7 * on})` : `rgba(67,56,202,${.6 * on})`;
      g.beginPath();
      if (mr) { g.moveTo(x, y - 9); g.lineTo(x + 9, y); g.lineTo(x, y + 9); g.lineTo(x - 9, y); } else g.arc(x, y, 7, 0, 7);
      g.fill();
      if (px != null && k % 3) { g.strokeStyle = `rgba(31,27,58,${.15 * on})`; g.lineWidth = 2; g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke(); }
      px = x; py = y;
    }
  }
  // The tag web.
  if (t >= 60 && t < 68.1) {
    const rot = (t - 60) * .06, fadeOut = 1 - P(t, 67.3, 68), dim = 1 - P(t, 62.6, 63.4) * .55;
    const pos = NET.map((nd, i) => {
      const k = Ez.expo(P(t, 60 + i * .012, 60.8 + i * .012));
      const dx = nd.x - 540, dy = nd.y - 1000;
      const s = lerp(.1, 1, k) * (1 - Ez.expoIn(P(t, 67.3, 68)));
      return [540 + (dx * Math.cos(rot) - dy * Math.sin(rot)) * s, 1000 + (dx * Math.sin(rot) + dy * Math.cos(rot)) * s + Math.sin(t + nd.ph) * 6, k];
    });
    g.lineWidth = 1.5;
    NET.forEach((nd, i) => {
      const lk = P(t, 60.9 + i * .01, 61.6 + i * .01);
      [i + 1, i + 7, i + 13].forEach((j) => {
        if (!pos[j]) return;
        g.strokeStyle = `rgba(94,234,212,${.22 * lk * fadeOut * dim})`;
        g.beginPath(); g.moveTo(pos[i][0], pos[i][1]); g.lineTo(pos[j][0], pos[j][1]); g.stroke();
      });
    });
    NET.forEach((nd, i) => {
      const [x, y, k] = pos[i];
      const rr = 5 + Math.sqrt(nd.total) * .9;
      g.fillStyle = nd.color; g.globalAlpha = k * fadeOut * dim;
      g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
      if (i < 12) { g.font = "700 30px Inter"; g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText(nd.display, x, y - rr - 12); }
      g.globalAlpha = 1;
    });
  }
  // Particle bursts on every impact, and the finale's convergence.
  IMPACTS.forEach((ti, n) => {
    const q = t - ti; if (q < 0 || q > 1.6) return;
    const r = rng(100 + n);
    for (let k = 0; k < 140; k += 1) {
      const a = r() * 7, v = 300 + r() * 1300, d = v * Ez.out(q / 1.6);
      g.fillStyle = k % 3 ? `rgba(255,${120 + Math.floor(r() * 120)},60,${(1 - q / 1.6).toFixed(3)})` : `rgba(255,255,255,${(1 - q / 1.6).toFixed(3)})`;
      g.beginPath(); g.arc(540 + Math.cos(a) * d, 960 + Math.sin(a) * d, 2 + r() * 5, 0, 7); g.fill();
    }
  });
  if (t >= 82.4 && t < 84) {
    const r = rng(77), q = Ez.expoIn(P(t, 82.4, 84));
    for (let k = 0; k < 200; k += 1) {
      const a = r() * 7, d = (400 + r() * 900) * (1 - q);
      g.fillStyle = `rgba(255,${150 + Math.floor(r() * 100)},80,${.8 * q})`;
      g.beginPath(); g.arc(540 + Math.cos(a) * d, 960 + Math.sin(a) * d, 2 + r() * 4, 0, 7); g.fill();
    }
  }
}

// ---------------------------------------------------------------- the frame
window.renderAt = function renderAt(t) {
  // Background: the current scene's tint, crossfaded into the next.
  const cur = SCENES.filter((s) => t >= s.a - .2 && t <= s.b + .2);
  const main = SCENES.find((s) => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];
  const nxt = SCENES[SCENES.indexOf(main) + 1];
  const k = nxt ? P(t, main.b - .3, main.b) : 0;
  const c1 = nxt ? mix(main.tint[0], nxt.tint[0], k) : main.tint[0], c2 = nxt ? mix(main.tint[1], nxt.tint[1], k) : main.tint[1];
  const lx = 50 + Math.sin(t * .4) * 30, ly = 30 + Math.cos(t * .3) * 20;
  document.getElementById("bg").style.background = `radial-gradient(ellipse 90% 60% at ${lx}% ${ly}%, ${c1}, transparent 70%), radial-gradient(ellipse 80% 60% at ${100 - lx}% ${100 - ly}%, ${c1}, transparent 70%), ${c2}`;

  SCENES.forEach((s) => {
    const on = cur.includes(s);
    s.root.style.display = on ? "block" : "none";
    if (on) { transition(s, t); s.update(t); }
  });
  drawFx(t);

  // Camera: a kick of shake on each impact, a breath on each beat while the groove runs.
  let sx = 0, sy = 0, rs = 0;
  IMPACTS.forEach((ti) => { const q = t - ti; if (q >= 0 && q < .6) { const a = 26 * Math.exp(-q * 7); sx += (hash(Math.floor(t * 30) + ti) - .5) * a; sy += (hash(Math.floor(t * 30) * 3 + ti) - .5) * a; rs += (hash(Math.floor(t * 30) * 7) - .5) * a * .05; } });
  const pump = grooving(t) ? .012 * Math.exp(-((t % BEAT) / BEAT) * 6) : 0;
  cam.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(${rs.toFixed(2)}deg) scale(${(1 + pump).toFixed(4)})`;

  // Flash: white on impacts, a softer one on each cold-open slam.
  let fl = 0;
  IMPACTS.forEach((ti) => { const q = t - ti; if (q >= 0 && q < .5) fl = Math.max(fl, Math.exp(-q * 9)); });
  if (t < 6) { const q = t % 1; fl = Math.max(fl, .35 * Math.exp(-q * 14)); }
  if (t >= 11.85 && t < 12.6) fl = Math.max(fl, .5 * P(t, 11.85, 12.25) * (1 - P(t, 12.25, 12.6)));
  document.getElementById("flash").style.opacity = fl.toFixed(3);

  // Blinds.
  let bl = null;
  BLINDS.forEach(([ti, col]) => { if (t > ti - .35 && t < ti + .35) bl = [ti, col]; });
  window.blindEls.forEach((b, i) => {
    if (!bl) { b.style.display = "none"; return; }
    const [ti, col] = bl, d = i * .025;
    const cover = Ez.io(P(t, ti - .33 + d, ti - .08 + d)), uncover = Ez.io(P(t, ti + .02 + d, ti + .3 + d));
    b.style.display = "block"; b.style.background = col;
    b.style.transformOrigin = uncover > 0 ? "50% 0%" : "50% 100%";
    b.style.transform = `scaleY(${(uncover > 0 ? 1 - uncover : cover).toFixed(3)})`;
  });

  // Glitch slices.
  const gq = GLITCH.map((ti) => t - ti).find((q) => q > -.12 && q < .22);
  window.sliceEls.forEach((s, i) => {
    if (gq === undefined) { s.style.display = "none"; return; }
    const r = rng(Math.floor(t * 30) * 31 + i);
    s.style.display = r() < .7 ? "block" : "none";
    s.style.top = `${Math.floor(r() * 1920)}px`; s.style.height = `${4 + r() * 60}px`;
    s.style.background = r() < .5 ? "rgba(34,225,255,.35)" : "rgba(255,42,85,.35)";
    s.style.transform = `translateX(${(r() - .5) * 200}px)`;
  });

  // Grain moves every frame.
  const gr = rng(Math.floor(t * 30));
  document.getElementById("grain").style.transform = `translate(${Math.floor(gr() * 200 - 100)}px,${Math.floor(gr() * 200 - 100)}px)`;

  // HUD.
  const hudOn = t > 10 && t < 84 ? 1 : 0;
  document.getElementById("hud").style.opacity = hudOn;
  const chapScene = SCENES.slice().reverse().find((s) => s.chapter && t >= s.a);
  window.hudChap.textContent = chapScene ? chapScene.chapter : "";
  window.hudBar.style.width = `${(820 * t / 90).toFixed(1)}px`;
  const cream = t >= 38 && t < 42;
  window.hudSite.style.color = window.hudChap.style.color = cream ? "rgba(31,27,58,.75)" : "rgba(255,255,255,.75)";
  document.getElementById("vig").style.opacity = cream ? .35 : 1;
};
</script>
