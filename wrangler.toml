# The Cloudflare Pages project is "daredavil" (it serves sankettambare.in).
# This has to match, or every `wrangler pages ...` command targets a project
# that does not exist.
name = "daredavil"
pages_build_output_dir = "build"

# Build-time environment variables (baked into the Vite bundle at deploy time).
# VITE_* variables are safe to commit here — the publishable key is designed to
# be exposed in the browser; RLS on Supabase guards all writes.
[vars]
VITE_SUPABASE_URL = "https://xjqbvvurlmbslikiukdm.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8FUmeJKKuTHvy3JFNPLfnQ_9TY6P2GG"
# Turnstile's SITE key is public by design — it ships to the browser, and
# /api/ask returns it so the widget can render. Only the SECRET key is a
# secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAExWIgz-0TmQzL1Q"
VITE_SUPABASE_ANON_KEY= "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqcWJ2dnVybG1ic2xpa2l1a2RtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMTUwNTYsImV4cCI6MjA5Njg5MTA1Nn0.5mfUNQFJCgSxfeB_mNU9ifsRLbIcVS9bt4EcNt80xpg"

# SUPABASE_SERVICE_ROLE_KEY is a secret — never put it here.
# Set it once via the CLI:
#   wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
# or via the Cloudflare dashboard: Settings → Environment Variables → Add secret.

# Workers AI — powers /ask: query embeddings (@cf/baai/bge-m3) and the fallback
# rungs of the model ladder. Free allowance is 10,000 neurons/day on both the
# Free and Paid plans, which is the whole budget this feature is designed around.
[ai]
binding = "AI"

# /ask also needs these secrets (never in [vars] — this file is committed):
#   wrangler pages secret put GEMINI_API_KEY
#   wrangler pages secret put ASK_IP_SALT
#   wrangler pages secret put TURNSTILE_SECRET_KEY   (optional)
