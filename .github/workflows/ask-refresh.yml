# Nightly refresh of the /ask second brain and the Writing Ledger data.
#
#   1. blogs:wordcount — re-counts every Substack/WordPress post and refreshes
#      the post-text cache (only new or edited posts are downloaded).
#   2. ask:index       — re-indexes every source; only new text is embedded.
#   3. logbook         — rebuilds public/data/logbook.json (/logbook) from the
#      text cache and the embeddings step 2 just wrote.
#   4. Commits public/data/writing-ledger.json and public/data/logbook.json
#      when their contents changed — not when only the generation date moved —
#      which triggers a Pages deploy.
#
# Repository secrets: SUPABASE_SERVICE_ROLE_KEY, CF_ACCOUNT_ID, CF_API_TOKEN.
# If `main` is branch-protected against bot pushes, the commit step fails;
# switch it to opening a pull request.

name: Ask refresh

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be indexed; write and commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ask-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public values, the same ones committed in wrangler.toml [vars].
      VITE_SUPABASE_URL: https://xjqbvvurlmbslikiukdm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8FUmeJKKuTHvy3JFNPLfnQ_9TY6P2GG
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The post-text cache lives in gitignored knowledge_base/. Restoring the
      # latest copy is what keeps a run from re-downloading every post body.
      - uses: actions/cache@v4
        with:
          path: knowledge_base/blog-posts-text.json
          key: blog-text-${{ github.run_id }}
          restore-keys: blog-text-

      - name: Count words and refresh post text
        run: npm run blogs:wordcount

      - name: Index new content
        run: npm run ask:index -- ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the Logbook data
        if: ${{ !inputs.dry_run }}
        run: npm run logbook

      - name: Commit the ledger and Logbook data if they changed
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            // Fields every run rewrites; a file whose rest is unchanged is not committed.
            const VOLATILE = ["generatedAt", "currentPeriod"];
            const strip = (text) => {
              const j = JSON.parse(text);
              VOLATILE.forEach((k) => delete j[k]);
              return JSON.stringify(j);
            };
            const changed = ["public/data/writing-ledger.json", "public/data/logbook.json"].filter((file) => {
              if (!fs.existsSync(file)) return false;
              let before = "";
              try { before = execSync(`git show HEAD:${file}`, { encoding: "utf8", maxBuffer: 1e8 }); } catch (_) {}
              return !before || strip(before) !== strip(fs.readFileSync(file, "utf8"));
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `files=${changed.join(" ")}\n`);
            console.log(changed.length ? `Changed: ${changed.join(", ")}` : "Data unchanged apart from dates.");
          '
          files=$(grep "^files=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          if [ -z "$files" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore(ledger): refresh writing ledger and logbook data"
          git push
